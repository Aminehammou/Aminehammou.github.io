# Exemple de flux de travail pour la création et le déploiement d'un site Jekyll sur GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # S'exécute lors des envois ciblant la branche par défaut
  push:
    branches: ["main"]

  # Permet d'exécuter ce flux de travail manuellement à partir de l'onglet Actions
  workflow_dispatch:

# Définit les autorisations du jeton GITHUB_TOKEN pour permettre le déploiement sur GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# N'autoriser qu'un seul déploiement simultané, en ignorant les exécutions mises en file d'attente entre 
# l'exécution en cours et la dernière mise en file d'attente.
# Cependant, veuillez NE PAS annuler les exécutions en cours, car nous souhaitons permettre à ces
# déploiements en production de se terminer.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
